<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to InterviewAI and continue your AI-powered interview practice.">
  <title>Login | InterviewAI</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-glow"></div>
    <section class="auth-panel glass-card animate-fade-up">
      <a class="logo" href="../index.html">InterviewAI</a>
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Login to continue your interview practice.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="error-msg" id="login-error" style="display:none;"></div>

        <button type="submit">Login</button>
      </form>

      <p class="helper-text">New here? <a href="../register/register.html">Create an account</a></p>
    </section>
  </main>

  <script src="../api.js"></script>
  <script src="login.js"></script>
</body>
</html>
