<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | InterviewAI</title>
    <link rel="stylesheet" href="profile.css">
</head>

<body>

```
<main class="profile-page">

    <section class="profile-panel">

        <h1>My Profile</h1>

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email">

            <label for="role">Target Role</label>
            <input type="text" id="role" name="role" placeholder="Example: Python Developer">

            <label for="skills">Skills</label>
            <input type="text" id="skills" name="skills" placeholder="Python, HTML, CSS, JavaScript">

            <label for="experience">Experience Level</label>
            <input type="text" id="experience" name="experience" placeholder="Beginner / Intermediate / Advanced">

            <button type="submit">Save Profile</button>

        </form>

    </section>

</main>
```

</body>

</html>
