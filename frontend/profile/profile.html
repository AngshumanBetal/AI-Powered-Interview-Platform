<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | InterviewAI</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html">InterviewAI</a>
    <nav>
      <a href="../dashboard/dashboard.html">Dashboard</a>
      <a href="../interview/interview.html">Interview</a>
      <a href="../result/result.html">Results</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="profile-page">
    <section class="profile-panel">
      <p class="eyebrow">Candidate Profile</p>
      <h1>Update your interview profile</h1>
      <p class="intro">Use this information to personalize future interview questions.</p>

      <form>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com">

        <label for="role">Target Role</label>
        <input type="text" id="role" name="role" placeholder="Example: Frontend Developer">

        <label for="skills">Key Skills</label>
        <textarea id="skills" name="skills" placeholder="Example: HTML, CSS, JavaScript, React"></textarea>

        <button type="submit">Save Profile</button>
      </form>
    </section>
  </main>
</body>
</html>
