<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your InterviewAI account and start practicing interviews with AI-powered feedback.">
  <title>Register | InterviewAI</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-glow"></div>
    <section class="auth-panel glass-card animate-fade-up">
      <a class="logo" href="../index.html">InterviewAI</a>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Set up your profile and start practicing interviews.</p>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            required
            minlength="6"
            oninput="checkStrength(this.value)"
          >
          <!-- Password Strength Meter -->
          <div class="strength-meter">
            <div class="strength-bar" id="strength-bar"></div>
          </div>
          <div class="strength-info">
            <span class="strength-label" id="strength-label">Enter at least 6 characters</span>
            <ul class="strength-rules" id="strength-rules">
              <li id="rule-length">✕ Minimum 6 characters</li>
              <li id="rule-upper">✕ One uppercase letter</li>
              <li id="rule-number">✕ One number</li>
              <li id="rule-special">✕ One special character (!@#$%)</li>
            </ul>
          </div>
        </div>
        <div class="error-msg" id="register-error" style="display:none;"></div>

        <button type="submit">Create Account</button>
      </form>

      <p class="helper-text">Already registered? <a href="../login/login.html">Login</a></p>
    </section>
  </main>

  <script src="../api.js"></script>
  <script src="register.js"></script>
</body>
</html>
