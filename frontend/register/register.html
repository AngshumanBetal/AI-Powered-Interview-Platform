<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | InterviewAI</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <a class="brand" href="../index.html">InterviewAI</a>
      <h1>Create your account</h1>
      <p>Set up your profile and start practicing interviews.</p>

      <form>
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" required>

        <button type="submit">Create Account</button>
      </form>

      <p class="helper-text">Already registered? <a href="../login/login.html">Login</a></p>
    </section>
  </main>
</body>
</html>
